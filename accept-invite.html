<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Set password</title>
  <link rel="stylesheet" href="jopen-shared.css" />
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="jopen-pagina">
    <div id="laden" class="jopen-subtitel">Checking invitation…</div>

    <form class="jopen-form" id="wachtwoord-form" style="display:none;">
      <h1 style="font-size:1.3em; margin-top:0;">Welcome to Jopen Brouwerij</h1>
      <p class="jopen-subtitel" style="margin-bottom:0;">Set your password below to log in.</p>

      <label for="wachtwoord">New password</label>
      <input type="password" id="wachtwoord" required minlength="8" autocomplete="new-password" />

      <label for="wachtwoord-herhaal">Confirm password</label>
      <input type="password" id="wachtwoord-herhaal" required minlength="8" autocomplete="new-password" />

      <button type="submit">Set password</button>
      <p id="melding" class="jopen-form-melding"></p>
    </form>

    <div id="geen-uitnodiging" class="jopen-form-melding fout" style="display:none; max-width:360px; margin:60px auto; text-align:center;">
      No valid invitation found. Ask an admin to send a new invite from the Users screen.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    // supabase-js picks up the access_token/refresh_token from the URL hash
    // (after the #) automatically when the client is created
    // (detectSessionInUrl, on by default), setting up the session for us.
    // We just wait for that here.
    async function initAcceptInvite() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      document.getElementById('laden').style.display = 'none';

      if (!session) {
        document.getElementById('geen-uitnodiging').style.display = 'block';
        return;
      }

      document.getElementById('wachtwoord-form').style.display = 'block';
    }

    document.getElementById('wachtwoord-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const wachtwoord = document.getElementById('wachtwoord').value;
      const herhaal = document.getElementById('wachtwoord-herhaal').value;
      const melding = document.getElementById('melding');

      if (wachtwoord !== herhaal) {
        melding.textContent = 'The passwords do not match.';
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Saving…';
      melding.className = 'jopen-form-melding';

      const { error } = await supabaseClient.auth.updateUser({ password: wachtwoord });

      if (error) {
        melding.textContent = 'Could not set password: ' + error.message;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Password set! Redirecting…';
      melding.className = 'jopen-form-melding ok';
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    });

    document.addEventListener('DOMContentLoaded', initAcceptInvite);
  </script>
</body>
</html>
