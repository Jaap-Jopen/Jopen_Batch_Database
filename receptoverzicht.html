<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jopen — Recipe overview</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  :root {
    --ink: #1c2b26;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --hop: #4c6b4f;
    --hop-dark: #33473a;
    --amber: #b4772c;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 3px solid var(--hop-dark);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--hop); }
  header .sub {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6b6355;
  }
  #config {
    max-width: 640px;
    margin: 24px auto;
    padding: 20px 24px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  #config label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b6355;
    margin-top: 12px;
  }
  #config input {
    width: 100%;
    padding: 9px 10px;
    margin-top: 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }
  #config button {
    margin-top: 16px;
    background: var(--hop-dark);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  #config button:hover { background: var(--hop); }
  #config .hint { font-size: 12px; color: #7a7266; margin-top: 10px; line-height: 1.5; }

  main { display: none; padding: 24px 32px 60px; max-width: 1100px; margin: 0 auto; }
  main.active { display: block; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  #search {
    flex: 1; min-width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--serif);
    font-size: 15px;
    background: #fff;
  }
  .count { font-family: var(--mono); font-size: 12px; color: #7a7266; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; background: #fff; }
  thead th {
    text-align: left;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b6355;
    padding: 10px 14px;
    border-bottom: 2px solid var(--hop-dark);
  }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  tbody tr { cursor: pointer; transition: background 0.12s; }
  tbody tr:hover { background: #eef0e6; }
  .status-pill {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 20px;
    display: inline-block;
  }
  .status-actief { background: #e1ead9; color: var(--hop-dark); }
  .status-concept { background: #f3e3c9; color: #8a5a1e; }
  .status-gearchiveerd { background: #e6e2d8; color: #7a7266; }

  #detail-view { display: none; }
  #detail-view.active { display: block; }
  .back-link {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--hop-dark);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 18px;
  }
  .back-link:hover { text-decoration: underline; }

  .recipe-title { font-size: 32px; margin: 0 0 4px; }
  .recipe-meta { font-family: var(--mono); font-size: 13px; color: #6b6355; margin-bottom: 24px; }
  .recipe-meta b { color: var(--ink); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-bottom: 28px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--hop-dark); font-family: var(--mono); border-bottom: 1px solid var(--line); padding-bottom: 8px;
  }
  .kv { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .kv span:first-child { color: #6b6355; }
  .kv span:last-child { font-family: var(--mono); }

  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--hop-dark);
    font-family: var(--mono); margin: 30px 0 10px; border-bottom: 2px solid var(--hop-dark); padding-bottom: 6px;
  }
  .ing-table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 10px; }
  .ing-table th {
    text-align: left; font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b6355; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .ing-table td { padding: 8px 12px; border-bottom: 1px solid #ece8dc; font-size: 14px; }
  .rol-tag {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    color: var(--amber); letter-spacing: 0.04em;
  }

  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; font-family: var(--mono); font-size: 13px; color: #7a7266;
  }
  .error { color: #a33f2c; }

  .param-columns { column-count: 2; column-gap: 28px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-bottom: 10px; }
  .param-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid #ece8dc; font-size: 14px; break-inside: avoid; }
  .param-row span:first-child { color: #6b6355; }
  .param-row span:last-child { font-family: var(--mono); }
  .param-row .tol { color: #a89f8e; font-size: 12px; }
</style>
</head>
<body>

<div id="jopen-nav"></div>

<header>
  <h1>Jopen<span>.</span>brouwerij</h1>
  <div class="sub" id="conn-status">not connected</div>
</header>

<main id="main">
  <div id="list-view">
    <div class="toolbar">
      <input id="search" placeholder="Search by name or beer style…">
      <div class="count" id="result-count"></div>
      <a href="recept-invoer.html" class="back-link" id="new-recipe-link" style="display:none; margin-bottom:0; background: var(--hop-dark); color:#fff; padding:8px 14px; border-radius:4px;">+ New recipe</a>
    </div>
    <div id="list-container"><div class="loading">Loading recipes…</div></div>
  </div>

  <div id="detail-view">
    <a class="back-link" id="back-btn">&larr; Back to overview</a>
    <div id="detail-container"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="nav.js"></script>
<script>
// Supabase-client (supabaseClient) en auth komen nu uit config.js, gedeeld
// door alle Jopen-app-pagina's. Zie config.js voor de credentials.
let allRecipes = [];
let huidigeGebruikerRol = null;

const mainEl = document.getElementById('main');
const connStatus = document.getElementById('conn-status');

// Display-only translation of the status values as stored in the database
// (Dutch: actief/concept/gearchiveerd) — the stored value itself is left
// unchanged, only what's shown to the user is translated.
function statusLabel(status) {
  const labels = { actief: 'Active', concept: 'Draft', gearchiveerd: 'Archived' };
  return labels[status] || status || 'Unknown';
}

function magBewerken() {
  return huidigeGebruikerRol === 'admin' || huidigeGebruikerRol === 'editor';
}

window.addEventListener('DOMContentLoaded', async () => {
  const gebruiker = await getHuidigeGebruiker();
  huidigeGebruikerRol = gebruiker ? gebruiker.rol : null;
  if (magBewerken()) {
    document.getElementById('new-recipe-link').style.display = 'inline-block';
  }

  try {
    const { error } = await supabaseClient.from('recipes').select('id').limit(1);
    if (error) throw error;
    mainEl.classList.add('active');
    connStatus.textContent = 'connected';
    loadRecipes();
  } catch (e) {
    connStatus.textContent = 'connection failed';
    document.getElementById('list-container').innerHTML =
      `<div class="error">Could not connect to Supabase: ${e.message || e}</div>`;
  }
});

async function loadRecipes() {
  const container = document.getElementById('list-container');
  const { data, error } = await supabaseClient
    .from('recipes')
    .select('id, naam, bierstijl, locatie, status, versie_major, versie_minor, recipe_group_id')
    .order('naam');
  if (error) {
    container.innerHTML = `<div class="error">Error loading: ${error.message}</div>`;
    return;
  }
  allRecipes = data || [];
  renderList(allRecipes);
}

function renderList(recipes) {
  const container = document.getElementById('list-container');
  document.getElementById('result-count').textContent = `${recipes.length} recipe${recipes.length===1?'':'s'}`;
  if (recipes.length === 0) {
    container.innerHTML = `<div class="empty">No recipes found.</div>`;
    return;
  }
  const rows = recipes.map(r => `
    <tr data-id="${r.id}">
      <td>${escapeHtml(r.naam)}</td>
      <td>${escapeHtml(r.bierstijl || '—')}</td>
      <td>${escapeHtml(r.locatie || '—')}</td>
      <td>v${r.versie_major ?? 1}.${r.versie_minor ?? 0}</td>
      <td><span class="status-pill status-${r.status}">${statusLabel(r.status)}</span></td>
    </tr>`).join('');
  container.innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Beer style</th><th>Location</th><th>Version</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  container.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.id));
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = allRecipes.filter(r =>
    (r.naam||'').toLowerCase().includes(q) || (r.bierstijl||'').toLowerCase().includes(q));
  renderList(filtered);
});

async function openDetail(id) {
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').classList.add('active');
  const container = document.getElementById('detail-container');
  container.innerHTML = `<div class="loading">Loading recipe…</div>`;

  const [recipe, specs, ferm, brouw, water, ingredients, revisies] = await Promise.all([
    supabaseClient.from('recipes').select('*').eq('id', id).single(),
    supabaseClient.from('recipe_specificaties').select('*').eq('recipe_id', id).maybeSingle(),
    supabaseClient.from('recipe_fermentatie').select('*').eq('recipe_id', id).maybeSingle(),
    supabaseClient.from('recipe_brouwspecificaties').select('*').eq('recipe_id', id).maybeSingle(),
    supabaseClient.from('recipe_water').select('*').eq('recipe_id', id).maybeSingle(),
    supabaseClient.from('recipe_ingredients').select('rol, hoeveelheid, eenheid, tijdstip, volgorde, notitie, ingredients(naam, categorie)').eq('recipe_id', id).order('rol').order('volgorde'),
    supabaseClient.from('recipe_revisies').select('*').eq('recipe_id', id).order('id', { ascending: false }),
  ]);

  if (recipe.error) {
    container.innerHTML = `<div class="error">Error loading: ${recipe.error.message}</div>`;
    return;
  }
  const r = recipe.data;
  const s = specs.data || {};
  const f = ferm.data || {};
  const b = brouw.data || {};
  const w = water.data || {};
  const ings = ingredients.data || [];
  const revisieData = revisies.data || [];

  // Andere versies van hetzelfde recept (zelfde recipe_group_id), voor het
  // "Previous versions"-lijstje onderaan de kaart.
  const { data: overigeVersies } = await supabaseClient
    .from('recipes')
    .select('id, versie_major, versie_minor, status')
    .eq('recipe_group_id', r.recipe_group_id)
    .neq('id', id)
    .order('versie_major', { ascending: false })
    .order('versie_minor', { ascending: false });

  const specRows = [
    ['Original extract', s.origineel_extract, '°P', s.origineel_extract_tol],
    ['Final extract', s.rest_extract, '°P', s.rest_extract_tol],
    ['Alcohol', s.alcohol, '% v/v', s.alcohol_tol],
    ['Bitterness', s.bitterheid, 'EBU', s.bitterheid_tol],
    ['Color', s.kleur, 'EBC', s.kleur_tol],
    ['pH', s.ph, '', s.ph_tol],
    ['ADF', s.adf_pct, '%', s.adf_pct_tol],
    ['Turbidity (lab)', s.troebeling_lab, 'EBC', s.troebeling_lab_tol],
    ['CO2 bottle', s.co2_fles, 'g/l', s.co2_fles_tol],
    ['CO2 can', s.co2_can, 'g/l', s.co2_can_tol],
    ['CO2 keg', s.co2_fust, 'g/l', s.co2_fust_tol],
    ['Headspace O2', s.headspace_o2, 'ppb', s.headspace_o2_tol],
    ['Dissolved O2', s.dissolved_o2, 'ppb', s.dissolved_o2_tol],
  ].filter(([,v]) => v !== null && v !== undefined);

  const fermRows = [
    ['Start fermentation temp', f.pitching_temp, '°C', f.pitching_temp_tol],
    ['Max fermentation temp', f.main_ferm_temp, '°C', f.main_ferm_temp_tol],
    ['T release', f.t_release, '°C', f.t_release_tol],
    ['Dry hop warm temp', f.temp_dry_warm, '°C', f.temp_dry_warm_tol],
    ['Extract dry warm 1', f.extract_dry_warm_1, '°P', f.extract_dry_warm_1_tol],
    ['Extract dry warm 2', f.extract_dry_warm_2, '°P', f.extract_dry_warm_2_tol],
    ['Extract dry warm 3', f.extract_dry_warm_3, '°P', f.extract_dry_warm_3_tol],
    ['Fermentation time', f.vergistingstijd, 'days', f.vergistingstijd_tol],
    ['Lager time', f.lagertijd, 'days', f.lagertijd_tol],
    ['Lager temp', f.lager_temp, '°C', f.lager_temp_tol],
    ['Pasteurization', f.pasteurisatie, 'PU', f.pasteurisatie_tol],
    ['Turbidity after separation', f.troebeling_na_sep, 'EBC', f.troebeling_na_sep_tol],
    ['Beer risk', f.bier_risico, '', null],
    ['Beer status', f.bier_status, '', null],
  ].filter(([,v]) => v !== null && v !== undefined);

  const brouwRows = [
    ['Mash filter chambers', b.kamers_mashfilter, ''],
    ['Roller mill', b.walsenmolen, ''],
    ['Mash thickness', b.beslag_dikte, ''],
    ['Boil volume', b.volume_kook, 'hl'],
    ['Wort pre-cooler temp', b.wortvoorkoeler_temp, '°C'],
    ['Final batch volume', b.eindvolume_brouwsel, 'hl'],
    ['Desired evaporation', b.gewenste_verdamping, '%'],
    ['Boil intensity', b.intensiteit_koken, 'KJ/min'],
    ['Whirlpool rest', b.whirlpool_rust, 'min'],
    ['Lauter factor', b.lauterfactor, ''],
  ].filter(([,v]) => v !== null && v !== undefined);

  const waterRows = [
    ['Ca', w.ca, 'ppm'], ['Mg', w.mg, 'ppm'], ['Na', w.na, 'ppm'],
    ['Cl', w.cl, 'ppm'], ['SO4', w.so4, 'ppm'], ['Cl:SO4 ratio', w.ratio_cl_so4, ''],
    ['Alkalinity', w.alkalinity, ''], ['Mash water', w.maischwater, ''],
    ['pH mash', w.ph_maische, ''], ['pH start boil', w.ph_start_koken, ''],
    ['pH end boil', w.ph_eind_koken, ''], ['Aeration', w.beluchting, 'l/h'],
  ].filter(([,v]) => v !== null && v !== undefined);

  function cardHtml(title, rows) {
    if (rows.length === 0) return '';
    return `<div class="card"><h3>${title}</h3>${rows.map(([label,val,unit]) =>
      `<div class="kv"><span>${label}</span><span>${escapeHtml(String(val))}${unit? ' '+unit:''}</span></div>`).join('')}</div>`;
  }

  // Zelfde als cardHtml, maar dan compact in twee kolommen en met een
  // tolerantie-waarde (+/-) ernaast, voor End product specifications en
  // Process parameters.
  function paramColumnsHtml(rows) {
    if (rows.length === 0) return '';
    return `<div class="param-columns">${rows.map(([label, val, unit, tol]) => `
      <div class="param-row">
        <span>${label}</span>
        <span>${tol !== null && tol !== undefined && tol !== '' ? `<span class="tol">±${escapeHtml(String(tol))}</span> ` : ''}${escapeHtml(String(val))}${unit ? ' ' + unit : ''}</span>
      </div>`).join('')}</div>`;
  }

  const rolLabels = {
    hoofdmout: 'Malt', hopgift_kook: 'Hop (boil)', dry_hop: 'Dry hop',
    toegift_brouwerij: 'Brewhouse addition', toegift_kelder: 'Cellar addition', gist: 'Yeast'
  };

  function ingTabelHtml(rollenFilter, kolomRol) {
    const subset = ings.filter(i => rollenFilter.includes(i.rol));
    if (subset.length === 0) return '<div class="empty">None added.</div>';
    const rows = subset.map(i => `
      <tr>
        ${kolomRol ? `<td><span class="rol-tag">${rolLabels[i.rol] || i.rol}</span></td>` : ''}
        <td>${escapeHtml(i.ingredients?.naam || '—')}</td>
        <td>${i.hoeveelheid ?? '—'} ${i.eenheid || ''}</td>
        <td>${escapeHtml(i.tijdstip || '—')}</td>
        <td>${escapeHtml(i.notitie || '—')}</td>
      </tr>`).join('');
    return `
      <table class="ing-table">
        <thead><tr>${kolomRol ? '<th>Role</th>' : ''}<th>Name</th><th>Amount</th><th>Timing</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function hopSomHtml() {
    const hopRijen = ings.filter(i => i.rol === 'hopgift_kook' || i.rol === 'dry_hop');
    if (hopRijen.length === 0) return '<div class="empty">None added.</div>';
    const totalen = {};
    hopRijen.forEach(i => {
      const naam = i.ingredients?.naam || 'unknown';
      const key = naam + '|' + (i.eenheid || '');
      if (!totalen[key]) totalen[key] = { naam, eenheid: i.eenheid || '', totaal: 0 };
      totalen[key].totaal += (i.hoeveelheid || 0);
    });
    const rows = Object.values(totalen).map(t => `
      <tr><td>${escapeHtml(t.naam)}</td><td>${t.totaal}${t.eenheid ? ' ' + escapeHtml(t.eenheid) : ''}</td></tr>`).join('');
    return `<table class="ing-table"><thead><tr><th>Hop / herb</th><th>Total amount</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  const vorigeVersiesHtml = (overigeVersies && overigeVersies.length > 0) ? `
    <div class="section-title">Previous versions</div>
    <table class="ing-table">
      <thead><tr><th>Version</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${overigeVersies.map(v => `
          <tr>
            <td>v${v.versie_major}.${v.versie_minor}</td>
            <td><span class="status-pill status-${v.status}">${statusLabel(v.status)}</span></td>
            <td><a class="back-link" style="margin:0;" onclick="openDetail('${v.id}')">View &rarr;</a></td>
          </tr>`).join('')}
      </tbody>
    </table>` : '';

  const revisiesHtml = revisieData.length > 0 ? `
    <table class="ing-table">
      <thead><tr><th>Version</th><th>Date</th><th>By</th><th>Comment</th></tr></thead>
      <tbody>
        ${revisieData.map(rv => `
          <tr>
            <td>v${rv.versie_major}.${rv.versie_minor}</td>
            <td>${rv.datum || ''}</td>
            <td>${escapeHtml(rv.door || '')}</td>
            <td>${escapeHtml(rv.wijziging || '')}</td>
          </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty">No revision history yet.</div>';

  container.innerHTML = `
    <h2 class="recipe-title">${escapeHtml(r.naam)}</h2>
    <div class="recipe-meta">
      <b>${escapeHtml(r.bierstijl || 'unknown style')}</b> · ${escapeHtml(r.locatie || '—')} ·
      version ${r.versie_major ?? 1}.${r.versie_minor ?? 0} · <span class="status-pill status-${r.status}">${statusLabel(r.status)}</span>
      ${magBewerken() ? ` · <a class="back-link" style="margin:0;" href="recept-invoer.html?id=${r.id}">Edit &rarr;</a>` : ''}
    </div>

    <div class="section-title">End product specifications</div>
    ${paramColumnsHtml(specRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Process parameters</div>
    ${paramColumnsHtml(fermRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Brewing parameters</div>
    <div class="grid-cards">${cardHtml('', brouwRows) || '<div class="empty">None entered.</div>'}</div>

    <div class="section-title">Malt &amp; Grains</div>
    ${ingTabelHtml(['hoofdmout'], false)}

    <div class="section-title">Hops and Herbs</div>
    ${ingTabelHtml(['hopgift_kook', 'dry_hop'], true)}

    <div class="section-title">Hops total weights</div>
    ${hopSomHtml()}

    <div class="section-title">Additions Brewing</div>
    ${ingTabelHtml(['toegift_brouwerij'], false)}

    <div class="section-title">Yeasts</div>
    ${ingTabelHtml(['gist'], false)}

    <div class="section-title">Additions Cellar</div>
    ${ingTabelHtml(['toegift_kelder'], false)}

    <div class="section-title">Target water profile</div>
    <div class="grid-cards">${cardHtml('', waterRows) || '<div class="empty">None entered.</div>'}</div>

    <div class="section-title">Revision data</div>
    ${revisiesHtml}

    ${vorigeVersiesHtml}
  `;
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('list-view').style.display = 'block';
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
