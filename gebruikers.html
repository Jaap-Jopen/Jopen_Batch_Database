<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Users</title>
  <link rel="stylesheet" href="jopen-shared.css" />
  <style>
    table.gebruikers-tabel { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 12px; }
    table.gebruikers-tabel th, table.gebruikers-tabel td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #ddd; }
    table.gebruikers-tabel th { font-size: 0.85em; color: #555; }
    .rol-badge { font-size: 0.8em; padding: 2px 8px; border-radius: 10px; background: #eee; }
    .rol-badge.admin { background: #fbe4e6; color: #A80016; }
    .actief-nee { color: #999; font-style: italic; }
    .geen-toegang { padding: 40px 0; color: #555; }
    .gebr-rol-select { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
    .gebr-opslaan-btn { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .gebr-verwijder-btn { padding: 4px 10px; border: 1px solid #A80016; color: #A80016; border-radius: 4px; background: #fff; cursor: pointer; }
    .gebr-verwijder-btn:hover { background: #fbe4e6; }
    .gebr-zelf { color: #999; font-size: 0.85em; font-style: italic; }
  </style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="jopen-pagina">
    <h1>Users</h1>
    <p class="jopen-subtitel">Overview of colleagues and their role, and inviting new colleagues.</p>

    <div id="geen-toegang" class="geen-toegang" style="display:none;">
      This screen is only visible to admins. Log in with an admin account to manage users.
    </div>

    <div id="admin-inhoud" style="display:none;">
      <div id="gebruikers-lijst"><div class="jopen-subtitel">Loading users…</div></div>
      <p id="lijst-melding" class="jopen-form-melding"></p>

      <h2 style="font-size:1.2em;">Invite a new colleague</h2>
      <form class="jopen-form" id="invite-form" style="margin: 0 0 40px;">
        <label for="invite-email">Email address</label>
        <input type="email" id="invite-email" required />

        <label for="invite-naam">Name</label>
        <input type="text" id="invite-naam" required />

        <label for="invite-rol">Role</label>
        <select id="invite-rol" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          <option value="viewer">Viewer</option>
          <option value="editor">Editor</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Send invite</button>
        <button type="button" id="genereer-link-btn" style="background:none; border:1px solid var(--jopen-red); color:var(--jopen-red); margin-left:8px;">Generate link instead (no email)</button>
        <p id="invite-melding" class="jopen-form-melding"></p>

        <div id="link-resultaat" style="display:none; margin-top:12px; padding:12px; background:#f7f7f5; border-radius:6px;">
          <label style="display:block; font-size:0.8em; color:#6b6b6b; margin-bottom:4px;">Subject line:</label>
          <input type="text" id="mail-onderwerp-veld" readonly value="You've been invited to the Jopen Batch Database" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:0.85em; margin-bottom:10px;" onclick="this.select()" />

          <label style="display:block; font-size:0.8em; color:#6b6b6b; margin-bottom:4px;">Preview:</label>
          <iframe id="mail-preview-iframe" style="width:100%; height:320px; border:1px solid #ccc; border-radius:4px; background:#fff;"></iframe>

          <div style="margin-top:10px;">
            <button type="button" id="kopieer-mail-btn" style="background:var(--jopen-red); color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Copy email (with formatting)</button>
            <span id="kopieer-melding" style="font-size:0.85em; margin-left:8px; color:#2f7d3c;"></span>
          </div>
          <p style="font-size:0.8em; color:#6b6b6b; margin:8px 0 0 0;">
            Copies subject + formatted body — paste directly into a new Outlook message.
          </p>

          <label style="display:block; font-size:0.8em; color:#6b6b6b; margin:12px 0 4px 0;">Or just the bare link:</label>
          <input type="text" id="link-resultaat-veld" readonly style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; font-size:0.85em;" onclick="this.select()" />
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    let huidigeGebruikerId = null;

    // Zelfde HTML als supabase-invite-email-template.html (repo-root) --
    // hier gedupliceerd zodat de pagina 'm direct kan invullen met de echte
    // link, zonder een los bestand te moeten fetchen. Pas je de e-mailtekst
    // aan in dat bestand, kopieer de wijziging dan ook hierheen.
    const UITNODIGING_MAIL_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen Batch Database invitation</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f2; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f2; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e5e5e0;">

          <!-- Header with logo and red bar -->
          <tr>
            <td style="background-color:#E0001D; padding:20px 32px;" align="left">
              <img src="https://nrouqtxkeeoayqudkiud.supabase.co/storage/v1/object/public/Jopen%20art/Jopen%20logo.png" alt="Jopen" width="48" height="48" style="display:block; border-radius:50%; background:#ffffff; padding:4px;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px 0; font-size:20px; color:#222222;">You've been invited to the Jopen Batch Database</h1>

              <p style="margin:0 0 16px 0; font-size:15px; line-height:1.5; color:#444444;">
                Someone at Jopen Brouwerij has invited you to an account on the
                <strong>Jopen Batch Database</strong> — the internal system we use within
                the brewery for recipe management and batch reports.
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
                <tr>
                  <td style="background-color:#E0001D; border-radius:6px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block; padding:12px 28px; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">
                      Create your account
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 20px 0; font-size:13px; line-height:1.5; color:#777777;">
                Button not working? Copy this link into your browser instead:<br>
                <a href="{{ .ConfirmationURL }}" style="color:#E0001D; word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>

              <hr style="border:none; border-top:1px solid #eeeeee; margin:24px 0;">

              <p style="margin:0 0 8px 0; font-size:13px; line-height:1.5; color:#777777;">
                <strong>Not phishing:</strong> this email was sent automatically because an
                administrator at Jopen Brouwerij added your email address to the Batch
                Database. If you weren't expecting this invitation, or you're unsure about
                the sender, please contact the person who invited you before clicking
                the button.
              </p>
              <p style="margin:0; font-size:13px; line-height:1.5; color:#777777;">
                We will never ask you to share your password by email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#faf9f7; padding:16px 32px; font-size:11px; color:#999999;">
              Jopen Batch Database · internal system of Jopen Brouwerij (Haarlem)<br>
              This invitation is single-use and will expire after some time.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>`;

    function bouwUitnodigingMail(link) {
      return UITNODIGING_MAIL_HTML.replaceAll('{{ .ConfirmationURL }}', link);
    }

    function bouwPlatteTekstVersie(link) {
      return [
        "You've been invited to the Jopen Batch Database",
        '',
        'Someone at Jopen Brouwerij has invited you to an account on the Jopen Batch Database',
        '— the internal system we use within the brewery for recipe management and batch reports.',
        '',
        'Create your account: ' + link,
        '',
        'Not phishing: this email was sent because an administrator at Jopen Brouwerij added your',
        'email address to the Batch Database. If you were not expecting this, contact the person',
        'who invited you before clicking the link. We will never ask you to share your password by email.',
      ].join('\n');
    }

    document.getElementById('genereer-link-btn').addEventListener('click', async () => {
      const email = document.getElementById('invite-email').value.trim();
      const naam = document.getElementById('invite-naam').value.trim();
      const rol = document.getElementById('invite-rol').value;
      const melding = document.getElementById('invite-melding');
      const resultaatDiv = document.getElementById('link-resultaat');

      if (!email || !naam) {
        melding.textContent = 'Fill in email address and name first.';
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Generating link…';
      melding.className = 'jopen-form-melding';
      resultaatDiv.style.display = 'none';

      const { data, error } = await supabaseClient.functions.invoke('generate-invite-link', {
        body: { email, naam, rol },
      });

      if (error || data?.error) {
        let detail = data?.error || error.message;
        try {
          const body = await error.context.json();
          if (body?.error) detail = body.error;
        } catch (_) { /* geen JSON-body of geen error.context -- val terug op wat we al hadden */ }
        melding.textContent = 'Could not generate link: ' + detail;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      const link = data.action_link;
      const emailHtml = bouwUitnodigingMail(link);
      const platteTekst = bouwPlatteTekstVersie(link);

      melding.textContent = `Link generated for ${email} — preview below, then copy the email.`;
      melding.className = 'jopen-form-melding ok';
      document.getElementById('link-resultaat-veld').value = link;
      document.getElementById('mail-preview-iframe').srcdoc = emailHtml;
      resultaatDiv.style.display = 'block';
      laadGebruikersLijst();

      document.getElementById('kopieer-mail-btn').onclick = async () => {
        const kopieerMelding = document.getElementById('kopieer-melding');
        try {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([emailHtml], { type: 'text/html' }),
              'text/plain': new Blob([platteTekst], { type: 'text/plain' }),
            }),
          ]);
          kopieerMelding.textContent = 'Copied — paste into a new Outlook message.';
        } catch (e) {
          kopieerMelding.textContent = 'Could not copy automatically, select the preview above and copy manually.';
        }
      };
    });

    async function laadGebruikersLijst() {
      const container = document.getElementById('gebruikers-lijst');
      const { data, error } = await supabaseClient
        .from('gebruikers')
        .select('id, naam, rol, actief, aangemaakt_op')
        .order('naam');

      if (error) {
        container.innerHTML = `<p class="jopen-form-melding fout">Could not load users: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="jopen-subtitel">No users yet.</p>`;
        return;
      }

      const rijen = data.map(g => {
        const isZelf = g.id === huidigeGebruikerId;
        return `
        <tr data-id="${g.id}">
          <td>${g.naam}</td>
          <td>
            ${isZelf
              ? `<span class="rol-badge ${g.rol}">${g.rol}</span>`
              : `<select class="gebr-rol-select">
                   <option value="viewer" ${g.rol === 'viewer' ? 'selected' : ''}>viewer</option>
                   <option value="editor" ${g.rol === 'editor' ? 'selected' : ''}>editor</option>
                   <option value="admin" ${g.rol === 'admin' ? 'selected' : ''}>admin</option>
                 </select>`}
          </td>
          <td>${g.actief ? 'Yes' : '<span class="actief-nee">No</span>'}</td>
          <td>
            ${isZelf
              ? `<span class="gebr-zelf">(you)</span>`
              : `<button class="gebr-opslaan-btn">Save</button>
                 <button class="gebr-verwijder-btn">Delete</button>`}
          </td>
        </tr>`;
      }).join('');

      container.innerHTML = `
        <table class="gebruikers-tabel">
          <thead><tr><th>Name</th><th>Role</th><th>Active</th><th></th></tr></thead>
          <tbody>${rijen}</tbody>
        </table>`;

      container.querySelectorAll('tr[data-id]').forEach(tr => {
        const opslaanBtn = tr.querySelector('.gebr-opslaan-btn');
        const verwijderBtn = tr.querySelector('.gebr-verwijder-btn');
        if (opslaanBtn) opslaanBtn.addEventListener('click', () => slaRolOp(tr));
        if (verwijderBtn) verwijderBtn.addEventListener('click', () => verwijderGebruiker(tr));
      });
    }

    async function slaRolOp(tr) {
      const melding = document.getElementById('lijst-melding');
      const id = tr.dataset.id;
      const nieuweRol = tr.querySelector('.gebr-rol-select').value;

      melding.textContent = 'Saving role…';
      melding.className = 'jopen-form-melding';

      const { error } = await supabaseClient
        .from('gebruikers')
        .update({ rol: nieuweRol })
        .eq('id', id);

      if (error) {
        melding.textContent = 'Save failed: ' + error.message;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Role updated.';
      melding.className = 'jopen-form-melding ok';
      laadGebruikersLijst();
    }

    async function verwijderGebruiker(tr) {
      const id = tr.dataset.id;
      const naam = tr.children[0].textContent;
      const melding = document.getElementById('lijst-melding');

      if (!confirm(`Delete ${naam}? This permanently removes their account and login access. This cannot be undone.`)) {
        return;
      }

      melding.textContent = 'Deleting…';
      melding.className = 'jopen-form-melding';

      const { data, error } = await supabaseClient.functions.invoke('delete-user', {
        body: { user_id: id },
      });

      if (error) {
        let detail = error.message;
        try {
          const body = await error.context.json();
          if (body?.error) detail = body.error;
        } catch (_) {
          // response wasn't JSON, or context was missing — fall back to error.message
        }
        melding.textContent = 'Delete failed: ' + detail;
        melding.className = 'jopen-form-melding fout';
        return;
      }
      if (data?.error) {
        melding.textContent = 'Delete failed: ' + data.error;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = `${naam} deleted.`;
      melding.className = 'jopen-form-melding ok';
      laadGebruikersLijst();
    }

    async function initGebruikersPagina() {
      const gebruiker = await getHuidigeGebruiker();

      if (!gebruiker || gebruiker.rol !== 'admin') {
        document.getElementById('geen-toegang').style.display = 'block';
        return;
      }

      huidigeGebruikerId = gebruiker.id;
      document.getElementById('admin-inhoud').style.display = 'block';
      laadGebruikersLijst();
    }

    document.getElementById('invite-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('invite-email').value.trim();
      const naam = document.getElementById('invite-naam').value.trim();
      const rol = document.getElementById('invite-rol').value;
      const melding = document.getElementById('invite-melding');

      melding.textContent = 'Sending invite…';
      melding.className = 'jopen-form-melding';

      // supabaseClient.functions.invoke() automatically sends the Authorization
      // header of the currently logged-in user — no manual token needed.
      const { data, error } = await supabaseClient.functions.invoke('invite-user', {
        body: { email, naam, rol },
      });

      if (error) {
        // supabase-js only gives a generic message on a non-2xx status
        // ("Edge Function returned a non-2xx status code") in error.message.
        // The real error message from our function is in the response body
        // itself (error.context is the raw fetch Response) — we try to read
        // that here so you don't have to check the Edge Function logs every time.
        let detail = error.message;
        try {
          const body = await error.context.json();
          if (body?.error) detail = body.error;
        } catch (_) {
          // response wasn't JSON, or context was missing — fall back to error.message
        }
        melding.textContent = 'Invite failed: ' + detail;
        melding.className = 'jopen-form-melding fout';
        return;
      }
      if (data?.error) {
        melding.textContent = 'Invite failed: ' + data.error;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = `Invite sent to ${email}.`;
      melding.className = 'jopen-form-melding ok';
      document.getElementById('invite-form').reset();
      laadGebruikersLijst();
    });

    document.addEventListener('DOMContentLoaded', initGebruikersPagina);
  </script>
</body>
</html>
