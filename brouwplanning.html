<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen — Brewing planning</title>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  main.bp-main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .bp-toolbar {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .bp-toolbar select {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
  }
  .bp-legenda {
    font-size: 0.82em; color: #6b6b6b; display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto;
  }
  .bp-legenda span { display: inline-flex; align-items: center; gap: 5px; }
  .bp-legenda .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .bp-legenda .dot.prio { background: #b8860b; }
  .bp-legenda .dot.over { background: #a33f2c; }

  .bp-scroll {
    position: relative; max-height: 74vh; overflow-y: auto;
    border: 1px solid #ddd; border-radius: 8px; background: #fff;
  }
  .bp-koprij {
    position: sticky; top: 0; z-index: 3; background: #f7f7f5;
    border-bottom: 1px solid #ddd; padding: 8px 12px;
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px;
  }
  .bp-koprij div { font-size: 0.78em; font-weight: 600; color: #6b6b6b; }

  .bp-weekblok { padding: 12px; border-bottom: 1px solid #eee; }
  .bp-weekblok:last-child { border-bottom: none; }

  .bp-weekkop {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
  }
  .bp-weeknr { font-weight: bold; }
  .bp-weekdatum { font-size: 0.85em; color: #6b6b6b; }
  .bp-cap {
    font-size: 0.82em; color: #6b6b6b; display: flex; align-items: center; gap: 4px;
  }
  .bp-cap input {
    width: 46px; padding: 2px 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em;
  }

  .bp-kolommen { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }

  .bp-col {
    background: #f7f7f5; border-radius: 8px; padding: 8px;
  }
  .bp-col.over { background: #fbeae6; border: 1px solid #e3a692; }
  .bp-col-teller { font-size: 0.78em; color: #6b6b6b; margin-bottom: 6px; }
  .bp-col.over .bp-col-teller { color: #a33f2c; font-weight: 600; }

  .bp-item {
    background: #fff; border: 1px solid #e2e2de; border-radius: 6px;
    padding: 5px 8px; margin-bottom: 4px; font-size: 0.82em;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bp-item:hover { border-color: var(--jopen-red); }
  .bp-item .bp-prio-ster { color: #b8860b; flex-shrink: 0; margin-left: 4px; font-size: 0.95em; }

  .bp-add-btn {
    width: 100%; font-size: 0.8em; padding: 4px; margin-top: 2px;
    background: #fff; border: 1px solid #ccc; border-radius: 5px; cursor: pointer;
  }
  .bp-add-btn:hover { border-color: var(--jopen-red); color: var(--jopen-red); }

  .bp-wp-banner {
    grid-column: 2 / span 3; display: flex; align-items: center; gap: 8px;
    font-size: 0.82em; color: #6b6b6b; margin-top: 2px;
  }
  .bp-wp-banner.over { color: #a33f2c; font-weight: 600; }
  .bp-wp-banner button { margin-left: auto; font-size: 0.85em; padding: 4px 12px; }

  /* --- Modal (add / edit) --- */
  .bp-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 200; align-items: flex-start; justify-content: center; padding-top: 8vh;
  }
  .bp-modal-overlay.open { display: flex; }
  .bp-modal {
    background: #fff; border-radius: 10px; padding: 20px 22px; width: 420px; max-width: 92vw;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .bp-modal h3 { margin: 0 0 14px 0; font-size: 1.05em; color: var(--jopen-red); }
  .bp-modal label {
    display: block; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.03em;
    color: #6b6b6b; margin: 12px 0 4px 0;
  }
  .bp-modal input[type="text"], .bp-modal input[type="number"], .bp-modal select {
    width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
  }
  .bp-modal-recept-resultaten {
    border: 1px solid #ccc; border-top: none; border-radius: 0 0 6px 6px;
    max-height: 160px; overflow-y: auto; display: none;
  }
  .bp-modal-recept-resultaten div { padding: 6px 9px; cursor: pointer; font-size: 0.9em; }
  .bp-modal-recept-resultaten div:hover { background: var(--jopen-red-tint); }
  .bp-modal-hl { font-size: 0.85em; color: #6b6b6b; margin-top: 6px; }
  .bp-modal-prio-row {
    display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 0.9em;
  }
  .bp-modal-knoppen { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  .bp-modal-knoppen button {
    padding: 8px 16px; border-radius: 6px; font-size: 0.9em; cursor: pointer;
  }
  .bp-btn-save { background: var(--jopen-red); color: #fff; border: none; }
  .bp-btn-save:hover { background: var(--jopen-red-dark); }
  .bp-btn-cancel { background: #fff; border: 1px solid #ccc; }
  .bp-btn-delete { background: #fff; border: 1px solid #a33f2c; color: #a33f2c; margin-left: auto; }
  .bp-btn-delete:hover { background: #fbeae6; }
  .bp-modal-melding { font-size: 0.85em; margin-top: 8px; }
  .bp-modal-melding.fout { color: #a33f2c; }
</style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="bp-main">
    <h1 style="margin-bottom:2px;">Brewing planning</h1>
    <p class="jopen-subtitel" style="margin-top:0;">Long-term brew schedule per week — JK, WP 60HL, WP 120HL and WP 320HL.</p>

    <div class="bp-toolbar">
      <label for="bp-jaar" style="font-size:0.9em; color:#6b6b6b;">Year</label>
      <select id="bp-jaar"></select>
      <div class="bp-legenda">
        <span><i class="dot prio"></i> Prio</span>
        <span><i class="dot over"></i> Over capacity</span>
      </div>
    </div>

    <div class="bp-scroll" id="bp-scroll">
      <div class="bp-koprij">
        <div>JK</div>
        <div>WP 60HL (&lt;80 hl)</div>
        <div>WP 120HL (80&ndash;140 hl)</div>
        <div>WP 320HL (&gt;140 hl)</div>
      </div>
      <div id="bp-weken-container">
        <div style="padding:20px; color:#999;">Loading…</div>
      </div>
    </div>
  </main>

  <!-- ============================== MODAL ============================== -->
  <div class="bp-modal-overlay" id="bp-modal-overlay">
    <div class="bp-modal">
      <h3 id="bp-modal-titel">Add brew</h3>

      <div id="bp-modal-recept-veld">
        <label>Recipe (short name)</label>
        <input type="text" id="bp-modal-recept-zoek" autocomplete="off" placeholder="Search…" />
        <div class="bp-modal-recept-resultaten" id="bp-modal-recept-resultaten"></div>
      </div>

      <label>Number of brews</label>
      <input type="number" id="bp-modal-brouwsels" min="0" step="0.5" value="1" />
      <div class="bp-modal-hl" id="bp-modal-hl-preview">= — hl</div>

      <label for="bp-modal-week">Week</label>
      <input type="number" id="bp-modal-week" min="1" max="53" />

      <div class="bp-modal-prio-row">
        <input type="checkbox" id="bp-modal-prio" style="width:auto;" />
        <label for="bp-modal-prio" style="margin:0; text-transform:none; letter-spacing:normal; color:#1f1f1f;">Prio</label>
      </div>

      <div class="bp-modal-knoppen">
        <button type="button" class="bp-btn-delete" id="bp-modal-delete" style="display:none;">Delete</button>
        <button type="button" class="bp-btn-cancel" id="bp-modal-cancel">Cancel</button>
        <button type="button" class="bp-btn-save" id="bp-modal-save">Save</button>
      </div>
      <div class="bp-modal-melding" id="bp-modal-melding"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    // ------------------------------------------------------------------
    // Status
    // ------------------------------------------------------------------
    let huidigJaar = new Date().getFullYear();
    let alleRecepten = [];               // { id, naam, short_name, brouwsel_hl }
    let capaciteitMap = {};              // `${group}_${week}` -> max_brouwsels
    let planningPerWeek = {};            // week -> { jk:[], wp_60hl:[], wp_120hl:[], wp_320hl:[] }
    let huidigeGebruikerId = null;

    // Modal-context: welk item wordt bewerkt (null = nieuw), en voor welke
    // week/groep een nieuw item wordt toegevoegd.
    let modalContext = { mode: 'add', item: null, week: null, group: 'jk' };
    let modalGeselecteerdRecipeId = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    // ------------------------------------------------------------------
    // ISO-weekhulpfuncties (geen library nodig)
    // ------------------------------------------------------------------
    function isoWeeksInYear(jaar) {
      const p = (y) => {
        const d = new Date(Date.UTC(y, 0, 1));
        const dow = d.getUTCDay() || 7;
        return dow === 4 || (dow === 3 && isLeapYear(y)) ? 53 : 52;
      };
      function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
      return p(jaar);
    }

    function mondayOfIsoWeek(jaar, week) {
      const jan4 = new Date(Date.UTC(jaar, 0, 4));
      const jan4Dag = (jan4.getUTCDay() + 6) % 7; // 0 = maandag
      const week1Maandag = new Date(jan4);
      week1Maandag.setUTCDate(jan4.getUTCDate() - jan4Dag);
      const maandag = new Date(week1Maandag);
      maandag.setUTCDate(week1Maandag.getUTCDate() + (week - 1) * 7);
      return maandag;
    }

    function formatDagMaand(d) {
      return `${d.getUTCDate()}-${d.getUTCMonth() + 1}`;
    }

    function weekDatumRange(jaar, week) {
      const maandag = mondayOfIsoWeek(jaar, week);
      const zondag = new Date(maandag);
      zondag.setUTCDate(maandag.getUTCDate() + 6);
      return `${formatDagMaand(maandag)} t/m ${formatDagMaand(zondag)}`;
    }

    // ------------------------------------------------------------------
    // HL -> planninggroep
    // ------------------------------------------------------------------
    function bepaalWpGroep(hl) {
      if (hl < 80) return 'wp_60hl';
      if (hl < 140) return 'wp_120hl';
      return 'wp_320hl';
    }

    // ------------------------------------------------------------------
    // Laden
    // ------------------------------------------------------------------
    async function laadRecepten() {
      const { data, error } = await supabaseClient
        .from('recipes')
        .select('id, naam, short_name, brouwsel_hl, status')
        .neq('status', 'gearchiveerd')
        .order('naam');
      if (error) { console.error('Kon recepten niet laden:', error); return; }
      alleRecepten = data || [];
    }

    async function laadCapaciteit(jaar) {
      const { data, error } = await supabaseClient
        .from('brew_capacity')
        .select('capacity_group, week_number, max_brouwsels')
        .eq('iso_year', jaar);
      if (error) { console.error('Kon capaciteit niet laden:', error); return; }
      capaciteitMap = {};
      (data || []).forEach(r => {
        capaciteitMap[`${r.capacity_group}_${r.week_number}`] = Number(r.max_brouwsels);
      });
    }

    function capaciteit(groep, week) {
      const key = `${groep}_${week}`;
      if (key in capaciteitMap) return capaciteitMap[key];
      return groep === 'jk' ? 18 : 23; // standaardwaarden
    }

    async function laadPlanning(jaar) {
      const { data, error } = await supabaseClient
        .from('brew_planning')
        .select('id, plan_group, week_number, recipe_id, aantal_brouwsels, hl, prio, sort_order')
        .eq('iso_year', jaar)
        .order('sort_order');
      if (error) { console.error('Kon brouwplanning niet laden:', error); return; }

      planningPerWeek = {};
      (data || []).forEach(r => {
        if (!planningPerWeek[r.week_number]) {
          planningPerWeek[r.week_number] = { jk: [], wp_60hl: [], wp_120hl: [], wp_320hl: [] };
        }
        planningPerWeek[r.week_number][r.plan_group].push(r);
      });
    }

    function receptNaam(recipeId) {
      const r = alleRecepten.find(x => String(x.id) === String(recipeId));
      return r ? (r.short_name || r.naam) : '(unknown recipe)';
    }

    // ------------------------------------------------------------------
    // Renderen
    // ------------------------------------------------------------------
    async function laadEnRenderAlles() {
      await Promise.all([laadCapaciteit(huidigJaar), laadPlanning(huidigJaar)]);
      renderWeken();
    }

    function renderItem(item) {
      const naam = escapeHtml(receptNaam(item.recipe_id));
      const hl = item.hl != null ? Number(item.hl).toFixed(0) : '—';
      return `
        <div class="bp-item" data-id="${item.id}">
          <span>${naam} · ${item.aantal_brouwsels}br · ${hl}hl</span>
          ${item.prio ? '<span class="bp-prio-ster" title="Prio">&#9733;</span>' : ''}
        </div>`;
    }

    function renderWeken() {
      const container = document.getElementById('bp-weken-container');
      const totaalWeken = isoWeeksInYear(huidigJaar);
      let html = '';

      for (let week = 1; week <= totaalWeken; week++) {
        const p = planningPerWeek[week] || { jk: [], wp_60hl: [], wp_120hl: [], wp_320hl: [] };

        const jkSom = p.jk.reduce((s, i) => s + Number(i.aantal_brouwsels), 0);
        const jkMax = capaciteit('jk', week);
        const jkOver = jkSom > jkMax;

        const wpSom = ['wp_60hl', 'wp_120hl', 'wp_320hl']
          .reduce((s, g) => s + p[g].reduce((s2, i) => s2 + Number(i.aantal_brouwsels), 0), 0);
        const wpMax = capaciteit('wp', week);
        const wpOver = wpSom > wpMax;

        html += `
          <div class="bp-weekblok">
            <div class="bp-weekkop">
              <span class="bp-weeknr">wk ${week}</span>
              <span class="bp-weekdatum">${weekDatumRange(huidigJaar, week)}</span>
              <span class="bp-cap">JK max <input type="number" min="0" class="bp-cap-input" data-group="jk" data-week="${week}" value="${jkMax}" /> brws</span>
              <span class="bp-cap">WP max <input type="number" min="0" class="bp-cap-input" data-group="wp" data-week="${week}" value="${wpMax}" /> brws</span>
            </div>
            <div class="bp-kolommen">
              <div class="bp-col ${jkOver ? 'over' : ''}">
                <div class="bp-col-teller">${jkSom}/${jkMax} brws</div>
                ${p.jk.map(renderItem).join('')}
                <button type="button" class="bp-add-btn bp-add-jk" data-week="${week}">+ brew</button>
              </div>
              <div class="bp-col ${wpOver ? 'over' : ''}">
                ${p.wp_60hl.map(renderItem).join('')}
              </div>
              <div class="bp-col ${wpOver ? 'over' : ''}">
                ${p.wp_120hl.map(renderItem).join('')}
              </div>
              <div class="bp-col ${wpOver ? 'over' : ''}">
                ${p.wp_320hl.map(renderItem).join('')}
              </div>
              <div class="bp-wp-banner ${wpOver ? 'over' : ''}">
                <span>WP total this week: ${wpSom}/${wpMax} brws</span>
                <button type="button" class="bp-add-wp" data-week="${week}">+ brew WP</button>
              </div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
      koppelWeekEventListeners();
    }

    function koppelWeekEventListeners() {
      document.querySelectorAll('.bp-cap-input').forEach(inp => {
        inp.addEventListener('change', async (e) => {
          const groep = e.target.dataset.group;
          const week = Number(e.target.dataset.week);
          const waarde = Number(e.target.value) || 0;
          const { error } = await supabaseClient.from('brew_capacity').upsert({
            capacity_group: groep, iso_year: huidigJaar, week_number: week,
            max_brouwsels: waarde, updated_by: huidigeGebruikerId,
          }, { onConflict: 'capacity_group,iso_year,week_number' });
          if (error) { console.error(error); alert('Could not save capacity: ' + error.message); return; }
          await laadEnRenderAlles();
        });
      });

      document.querySelectorAll('.bp-add-jk').forEach(btn => {
        btn.addEventListener('click', () => openModal('add', null, Number(btn.dataset.week), 'jk'));
      });
      document.querySelectorAll('.bp-add-wp').forEach(btn => {
        btn.addEventListener('click', () => openModal('add', null, Number(btn.dataset.week), 'wp'));
      });
      document.querySelectorAll('.bp-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const item = Object.values(planningPerWeek).flatMap(w => [...w.jk, ...w.wp_60hl, ...w.wp_120hl, ...w.wp_320hl])
            .find(i => String(i.id) === String(id));
          if (item) openModal('edit', item, item.week_number, null);
        });
      });
    }

    // ------------------------------------------------------------------
    // Modal (add / edit)
    // ------------------------------------------------------------------
    function openModal(mode, item, week, group) {
      modalContext = { mode, item, week, group };
      modalGeselecteerdRecipeId = item ? item.recipe_id : null;

      document.getElementById('bp-modal-titel').textContent = mode === 'edit' ? 'Edit brew' : 'Add brew';
      document.getElementById('bp-modal-recept-zoek').value = item ? escapeHtml(receptNaam(item.recipe_id)) : '';
      document.getElementById('bp-modal-recept-resultaten').style.display = 'none';
      document.getElementById('bp-modal-brouwsels').value = item ? item.aantal_brouwsels : 1;
      document.getElementById('bp-modal-week').value = week;
      document.getElementById('bp-modal-prio').checked = item ? !!item.prio : false;
      document.getElementById('bp-modal-delete').style.display = mode === 'edit' ? 'inline-block' : 'none';
      document.getElementById('bp-modal-melding').textContent = '';
      werkHlPreview();
      document.getElementById('bp-modal-overlay').classList.add('open');
    }

    function sluitModal() {
      document.getElementById('bp-modal-overlay').classList.remove('open');
    }

    function werkHlPreview() {
      const recept = alleRecepten.find(r => String(r.id) === String(modalGeselecteerdRecipeId));
      const brouwsels = Number(document.getElementById('bp-modal-brouwsels').value) || 0;
      const preview = document.getElementById('bp-modal-hl-preview');
      if (recept && recept.brouwsel_hl != null) {
        const hl = brouwsels * Number(recept.brouwsel_hl);
        preview.textContent = `= ${hl.toFixed(0)} hl (from recipe)`;
      } else {
        preview.textContent = '= — hl (select a recipe)';
      }
    }

    document.getElementById('bp-modal-recept-zoek').addEventListener('input', (e) => {
      modalGeselecteerdRecipeId = null;
      werkHlPreview();
      const term = e.target.value.trim().toLowerCase();
      const container = document.getElementById('bp-modal-recept-resultaten');
      if (term === '') { container.style.display = 'none'; return; }
      const matches = alleRecepten.filter(r =>
        r.naam.toLowerCase().includes(term) || (r.short_name || '').toLowerCase().includes(term)
      ).slice(0, 20);
      container.innerHTML = matches.length
        ? matches.map(r => `<div data-id="${r.id}">${escapeHtml(r.short_name || r.naam)} <span style="color:#999;">(${escapeHtml(r.naam)})</span></div>`).join('')
        : '<div style="color:#999;">No matching recipes.</div>';
      container.style.display = 'block';
    });
    document.getElementById('bp-modal-recept-resultaten').addEventListener('click', (e) => {
      const rij = e.target.closest('[data-id]');
      if (!rij) return;
      modalGeselecteerdRecipeId = rij.dataset.id;
      document.getElementById('bp-modal-recept-zoek').value = escapeHtml(receptNaam(rij.dataset.id));
      document.getElementById('bp-modal-recept-resultaten').style.display = 'none';
      werkHlPreview();
    });
    document.getElementById('bp-modal-brouwsels').addEventListener('input', werkHlPreview);
    document.getElementById('bp-modal-cancel').addEventListener('click', sluitModal);
    document.getElementById('bp-modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'bp-modal-overlay') sluitModal();
    });

    document.getElementById('bp-modal-save').addEventListener('click', async () => {
      const melding = document.getElementById('bp-modal-melding');
      const recept = alleRecepten.find(r => String(r.id) === String(modalGeselecteerdRecipeId));
      const brouwsels = Number(document.getElementById('bp-modal-brouwsels').value);
      const week = Number(document.getElementById('bp-modal-week').value);
      const prio = document.getElementById('bp-modal-prio').checked;

      if (!recept) { melding.textContent = 'Select a recipe first.'; melding.className = 'bp-modal-melding fout'; return; }
      if (!brouwsels || brouwsels <= 0) { melding.textContent = 'Enter a number of brews.'; melding.className = 'bp-modal-melding fout'; return; }
      if (!week || week < 1 || week > 53) { melding.textContent = 'Enter a valid week number.'; melding.className = 'bp-modal-melding fout'; return; }

      const hl = brouwsels * Number(recept.brouwsel_hl || 0);
      const planGroup = modalContext.mode === 'edit'
        ? (modalContext.item.plan_group === 'jk' ? 'jk' : bepaalWpGroep(hl))
        : (modalContext.group === 'jk' ? 'jk' : bepaalWpGroep(hl));

      melding.textContent = 'Saving…';
      melding.className = 'bp-modal-melding';

      if (modalContext.mode === 'edit') {
        const { error } = await supabaseClient.from('brew_planning').update({
          recipe_id: recept.id, aantal_brouwsels: brouwsels, hl, prio,
          week_number: week, plan_group: planGroup, bijgewerkt_op: new Date().toISOString(),
        }).eq('id', modalContext.item.id);
        if (error) { melding.textContent = 'Could not save: ' + error.message; melding.className = 'bp-modal-melding fout'; return; }
      } else {
        const { error } = await supabaseClient.from('brew_planning').insert({
          plan_group: planGroup, iso_year: huidigJaar, week_number: week,
          recipe_id: recept.id, aantal_brouwsels: brouwsels, hl, prio,
          aangemaakt_door: huidigeGebruikerId,
        });
        if (error) { melding.textContent = 'Could not save: ' + error.message; melding.className = 'bp-modal-melding fout'; return; }
      }

      sluitModal();
      await laadEnRenderAlles();
    });

    document.getElementById('bp-modal-delete').addEventListener('click', async () => {
      if (!modalContext.item) return;
      if (!confirm('Delete this planned brew? This cannot be undone.')) return;
      const { error } = await supabaseClient.from('brew_planning').delete().eq('id', modalContext.item.id);
      if (error) { alert('Could not delete: ' + error.message); return; }
      sluitModal();
      await laadEnRenderAlles();
    });

    // ------------------------------------------------------------------
    // Init
    // ------------------------------------------------------------------
    function vulJaarSelector() {
      const select = document.getElementById('bp-jaar');
      const dit = new Date().getFullYear();
      for (let j = dit - 1; j <= dit + 2; j++) {
        const opt = document.createElement('option');
        opt.value = j; opt.textContent = j;
        if (j === huidigJaar) opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener('change', async () => {
        huidigJaar = Number(select.value);
        await laadEnRenderAlles();
      });
    }

    (async function init() {
      const ok = await vereisIngelogd();
      if (!ok) return;
      const gebruiker = await getHuidigeGebruiker();
      huidigeGebruikerId = gebruiker ? gebruiker.id : null;

      vulJaarSelector();
      await laadRecepten();
      await laadEnRenderAlles();
    })();
  </script>
</body>
</html>
