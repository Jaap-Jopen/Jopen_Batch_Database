<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Inloggen</title>
  <link rel="stylesheet" href="jopen-shared.css" />
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="jopen-pagina">
    <form class="jopen-form" id="login-form">
      <h1 style="font-size:1.3em; margin-top:0;">Inloggen</h1>

      <label for="email">E-mailadres</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="wachtwoord">Wachtwoord</label>
      <input type="password" id="wachtwoord" required autocomplete="current-password" />

      <button type="submit">Inloggen</button>

      <p id="login-melding" class="jopen-form-melding"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const wachtwoord = document.getElementById('wachtwoord').value;
      const melding = document.getElementById('login-melding');

      melding.textContent = 'Bezig met inloggen...';
      melding.className = 'jopen-form-melding';

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: wachtwoord,
      });

      if (error) {
        melding.textContent = 'Inloggen mislukt: ' + error.message;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
